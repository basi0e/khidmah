<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B8A5F">
<meta name="description" content="Book trusted plumbers, electricians, AC technicians and more in Riyadh and Dammam.">
<title>Khidmah Home Services</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B8A5F'/%3E%3Cpath d='M7 15l9-7 9 7M10 14v10h12V14M14 24v-5h4v5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<style>
/* Layout: WhatsApp-code sign-in gate, then one of three apps (customer marketplace, provider job inbox, admin console). Sticky top bar, bottom nav on phones, bottom sheets for every form */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --sunk:#E9EFEC; --ink:#0F2620; --muted:#586C65; --line:#D9E3DE;
  --accent:#0B8A5F; --accent-ink:#FFFFFF; --accent-soft:#DFF2E9; --sun:#E89A0C; --sun-soft:#FFF1D6; --sun-ink:#8A5600;
  --danger:#C2412D; --danger-soft:#FBE7E3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1613; --surface:#13201C; --sunk:#192A25; --ink:#E6F0EC; --muted:#94A9A2; --line:#253832;
  --accent:#30C28C; --accent-ink:#04271A; --accent-soft:#16392C; --sun:#F4B53A; --sun-soft:#3B2E10; --sun-ink:#F4C766;
  --danger:#F07C66; --danger-soft:#3A1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1613; --surface:#13201C; --sunk:#192A25; --ink:#E6F0EC; --muted:#94A9A2; --line:#253832;
  --accent:#30C28C; --accent-ink:#04271A; --accent-soft:#16392C; --sun:#F4B53A; --sun-soft:#3B2E10; --sun-ink:#F4C766;
  --danger:#F07C66; --danger-soft:#3A1F1A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body.has-bot{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media (min-width:860px){body.has-bot{padding-bottom:0}}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.ic{width:20px;height:20px;stroke-width:1.9;flex:none}
.muted{color:var(--muted)}
.sm-txt{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;background:none;border:0;padding:0}
.brand small{font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.city{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px}
.city select{border:0;background:transparent;font-weight:600;padding:2px;outline:none}
.bell{position:relative;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.bell .dot{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;border-radius:999px;font-size:10px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-weight:600;font-size:14px}
.me .ava-s{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.me .nm{max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.me .nm{display:none}.me{padding:3px}}
.topnav{display:none;gap:2px}
@media (min-width:860px){.topnav{display:flex}}
.topnav button{background:none;border:0;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
.topnav button[aria-current="page"]{color:var(--ink);background:var(--sunk)}

/* bottom nav */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media (min-width:860px){.botnav{display:none!important}}
.botnav button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 2px}
.botnav button[aria-current="page"]{color:var(--accent)}
.badge-n{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px;font-variant-numeric:tabular-nums}
.botnav .badge-n{position:absolute;top:2px;left:calc(50% + 6px);margin:0}

/* auth */
.auth{display:grid;gap:24px;padding-block:28px 48px;align-items:start}
@media (min-width:900px){.auth{grid-template-columns:1fr 480px;gap:48px;padding-block:56px 64px;align-items:center}}
.auth-side h1{font-size:clamp(32px,5.4vw,54px);font-weight:800;letter-spacing:-.025em;margin-top:10px}
.auth-side h1 em,.hero h1 em{font-style:normal;color:var(--accent)}
.auth-side .lead{color:var(--muted);font-size:17px;max-width:44ch;margin:14px 0 24px}
.roles-info{display:grid;gap:12px}
@media (min-width:560px){.roles-info{grid-template-columns:1fr 1fr}}
@media (max-width:899px){.auth-side .roles-info{display:none}}
.ri{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:6px}
.ri p{margin:0;color:var(--muted);font-size:14px}
.tile{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.auth-card{padding:22px}
@media (min-width:560px){.auth-card{padding:28px}}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;margin-bottom:20px}
.tabs button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,30,25,.12)}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolepick .opt span{padding:14px 12px;text-align:left;display:grid;gap:4px}
.rolepick .opt span strong{display:flex;align-items:center;gap:8px;font-size:15px}
.formerr{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.forminfo{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:inherit}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:6px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:420px){.demo{grid-template-columns:1fr}}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:360px}
.otp input{width:100%;height:56px;text-align:center;font-family:var(--display);font-size:24px;font-weight:700;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;font-variant-numeric:tabular-nums}
.otp input:focus{border-color:var(--accent);outline:none}
.otp.bad input{border-color:var(--danger)}
.devcode{border:1.5px dashed var(--sun);background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;padding:10px 12px;font-size:14px}
.devcode b{font-family:var(--display);font-size:18px;letter-spacing:.12em}
.wa{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.wa .ic{color:var(--accent);width:18px;height:18px}
.resend{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}

/* hero */
.hero{padding-block:36px 28px;display:grid;gap:28px}
@media (min-width:880px){.hero{grid-template-columns:1.25fr .9fr;align-items:center;padding-block:56px 40px}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.025em;margin-top:10px}
.hero p.lead{color:var(--muted);font-size:17px;max-width:46ch;margin:14px 0 22px}
.search{position:relative;display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;align-items:center;max-width:560px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:10px 0;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn .ic{width:18px;height:18px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(10,30,25,.14);overflow:hidden;z-index:5}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:11px 14px}
.sugg button:hover,.sugg button.on{background:var(--sunk)}
.sugg small{color:var(--muted);margin-left:auto}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:16px}
.steps h3{font-size:18px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.step b{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display)}
.step p{margin:2px 0 0;color:var(--muted);font-size:14px}
.trust{display:flex;flex-wrap:wrap;gap:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.trust span{display:flex;align-items:center;gap:6px}
.trust .ic{width:16px;height:16px;color:var(--accent)}

/* sections */
section.block{padding-block:20px 36px}
.page{padding-block:28px 48px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.015em}
.sec-h p{margin:4px 0 0;color:var(--muted)}
.grid-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.grid-cats{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){.grid-cats{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1080px){.grid-cats{grid-template-columns:repeat(5,1fr)}}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s}
.cat:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat strong{font-size:15px}
.cat small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* providers */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--muted);font-weight:600;margin-bottom:12px}
.res-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.res-head .tile{width:52px;height:52px;border-radius:14px}
.res-head h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-weight:600;font-size:14px;margin-left:auto}
.list{display:grid;gap:12px}
@media (min-width:880px){.list.two{grid-template-columns:1fr 1fr}}
.pro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px}
.pro.fresh{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;background:var(--sunk);color:var(--ink);border:0;padding:0;flex:none}
.pro-main{min-width:0;display:grid;gap:6px}
.pro-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkname{background:none;border:0;padding:0;font-weight:700;font-size:16px;text-align:left}
.linkname:hover{color:var(--accent)}
.heart{background:none;border:0;padding:4px;margin-left:auto;color:var(--muted);display:grid;place-items:center}
.heart[aria-pressed="true"]{color:var(--danger)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--accent)}
.verified .ic{width:15px;height:15px}
.newtag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:14px;height:14px}
.star{color:var(--sun);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;background:var(--sunk);border-radius:6px;padding:2px 8px}
.pro-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;flex-wrap:wrap}
.pro-foot .btns{display:flex;gap:8px}
.price{font-variant-numeric:tabular-nums}
.price small{color:var(--muted);display:block;font-size:12px}
.price b{font-family:var(--display);font-size:20px}
.note{font-size:13px;color:var(--muted);margin-top:18px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.room .pic{height:110px;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,transparent 12px 24px),var(--accent-soft);display:flex;align-items:flex-end;padding:10px}
.room .pic span{background:var(--surface);border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px}
.room .body{padding:14px 16px 16px;display:grid;gap:8px}

.phead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.phead .ava{width:76px;height:76px;font-size:26px}
.phead h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
.pgrid{display:grid;gap:14px;margin-top:20px}
@media (min-width:900px){.pgrid{grid-template-columns:1.3fr .7fr;align-items:start}}
.plist{display:grid}
.plist div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.plist div:last-child{border-bottom:0}
.rev{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:4px}
.rev:last-child{border-bottom:0}
.rev p{margin:0}
.reply{margin-top:4px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px}
.sticky-cta{position:sticky;top:76px}

/* cards, lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.card h3{font-size:18px;margin-bottom:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:32px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty .tile{width:56px;height:56px;border-radius:16px}
.empty p{color:var(--muted);margin:0;max-width:42ch}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.bk.click{cursor:pointer;text-align:left;width:100%;font:inherit}
.bk.click:hover{border-color:var(--accent)}
.bk-top{display:flex;justify-content:space-between;gap:10px;align-items:start}
.bk-top strong{font-size:16px}
.ref{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.req{background:var(--sun-soft);color:var(--sun-ink)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.can{background:var(--danger-soft);color:var(--danger)}
.pill.done{background:var(--sunk);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.samplenote{font-size:12px;color:var(--muted);font-style:italic}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px 16px;margin-bottom:18px;background:var(--sun-soft);color:var(--sun-ink)}
.banner.ok{background:var(--accent-soft);color:var(--ink)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.banner p{margin:2px 0 0;font-size:14px}
.banner .btn{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stats.four{grid-template-columns:repeat(2,1fr)}
@media (min-width:720px){.stats.four{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.stat span{font-size:13px;color:var(--muted)}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.segs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.segs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* booking detail */
.bgrid{display:grid;gap:14px}
@media (min-width:900px){.bgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start}}
.stack{display:grid;gap:14px;min-width:0}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tl div{display:grid;gap:6px;font-size:12px;color:var(--muted);align-content:start}
.tl i{height:6px;border-radius:999px;background:var(--line);display:block}
.tl .done{color:var(--ink);font-weight:600}
.tl .done i{background:var(--accent)}
.tl small{font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.msgs{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px;min-height:140px;max-height:380px}
.msg{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;font-size:14px;background:var(--sunk);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-radius:14px 14px 4px 14px}
.msg time{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px;text-align:center}
.chatform{display:flex;gap:8px;margin-top:12px}
.chatform input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.chatform input:focus{border-color:var(--accent);outline:none}
.bill{display:grid;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.bill div{display:flex;justify-content:space-between;gap:12px}
.bill .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:700;font-size:16px}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label{font-size:34px;color:var(--line);cursor:pointer;line-height:1}
.stars input:checked ~ label,.stars label:hover,.stars label:hover ~ label{color:var(--sun)}
.stars input:focus-visible + label{outline:2px solid var(--accent);border-radius:4px}
.phone{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.copy{background:var(--sunk);border:0;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}

/* account etc */
.narrow{max-width:720px}
.codein{font-family:var(--display);font-size:26px!important;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.acct-head{display:flex;gap:14px;align-items:center}
.acct-head .ava{width:60px;height:60px;font-size:22px;background:var(--accent-soft);color:var(--accent)}
.menu{display:grid}
.menu button{display:flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;text-align:left;font-weight:600}
.menu button:last-child{border-bottom:0}
.menu .chev{margin-left:auto;color:var(--muted)}
.menu .sub{font-weight:500;color:var(--muted);font-size:13px;margin-left:auto}
.menu .sub + .chev{margin-left:0}
.notif{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.notif:last-child{border-bottom:0}
.notif.unread{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.notif .ic{color:var(--accent);margin-top:2px}
.notif small{display:block;color:var(--muted);font-size:12px}
details.faq{border-bottom:1px solid var(--line);padding:12px 0}
details.faq:last-child{border-bottom:0}
details.faq summary{font-weight:600;cursor:pointer}
details.faq p{color:var(--muted);margin:8px 0 0;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row > div{min-width:0}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:560px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl .n{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.prose h3{font-size:17px;margin:18px 0 6px}
.prose p{margin:0;color:var(--muted)}

/* forms */
.form{display:grid;gap:14px}
.row2{display:grid;gap:14px}
@media (min-width:560px){.row2{grid-template-columns:1fr 1fr}}
label.f{display:grid;gap:6px;font-size:14px;font-weight:600}
.f input,.f select,.f textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-weight:400;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.err{color:var(--danger);font-weight:500;font-size:13px}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--danger)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px;min-width:0}
legend{font-size:14px;font-weight:600;margin-bottom:6px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0}
.opt span{display:block;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;background:var(--bg);text-align:center;height:100%}
.opt span small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.opt.wide span{text-align:left}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{border-radius:22px;padding:24px}}
.sheet-h{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:16px}
.sheet-h h2{font-size:22px}
.sheet-h p{margin:4px 0 0;color:var(--muted);font-size:14px}
.x{background:var(--sunk);border:0;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
@media (min-width:860px){.toast{bottom:28px}}
footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);padding:48px 0}
.loading .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.devbar{background:var(--sun-soft);color:var(--sun-ink);font-size:13px;text-align:center;padding:6px 16px}
.narrow{max-width:720px}
</style>
</head>
